name: Deploy Huyền Bút Các

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Kiểm tra cấu hình Supabase
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Thiếu GitHub Variable: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Thiếu GitHub Variable: VITE_SUPABASE_ANON_KEY"; exit 1; }
          if [ -z "$VITE_WEB_PUSH_VAPID_PUBLIC_KEY" ]; then echo "::warning::Thiếu VITE_WEB_PUSH_VAPID_PUBLIC_KEY — lịch vẫn chạy nhưng Web Push khi app đóng sẽ chưa hoạt động."; fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_VAPID_PUBLIC_KEY }}
      - run: npm run lint
        name: Oxlint
      - run: npm run build
        name: Typecheck + build (tsc -b && vite build)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_VAPID_PUBLIC_KEY }}
      - run: npm run test
        name: Vitest
      - name: Đóng gói mã nguồn 0.18.0
        run: zip -r HuyenButCac-0.18.0-source.zip . -x '.git/*' 'node_modules/*' 'dist/*' 'HuyenButCac-0.18.0-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: HuyenButCac-0.18.0-source
          path: HuyenButCac-0.18.0-source.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
